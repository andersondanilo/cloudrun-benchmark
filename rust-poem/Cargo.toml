[package]
name = "benchmark-rust-poem"
version = "0.0.0"
edition = "2021"

[dependencies]
poem = "3"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
